<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>al present</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
:root{--bg:#E8ECF4;--ink:#10131F;--mut:#5B6478;--acc:#2F3DFF;--line:#D3D9E6}
body{font:16px/1.5 Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;padding:clamp(16px,4vw,48px)}
h1,h2,.code{font-family:Unbounded,Onest,sans-serif}
header,main{max-width:1080px;margin:0 auto}
header{margin-bottom:28px}
h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.02em}
header p{color:var(--mut);margin-top:6px}
main{display:grid;gap:20px;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
h2{font-size:20px;font-weight:500}
.room{background:var(--ink);color:#fff;border-radius:28px;padding:clamp(22px,3vw,36px);min-height:320px;display:flex;flex-direction:column;justify-content:center}
.room p{color:#AEB6CC;margin:10px 0 22px}
.code{display:flex;gap:8px;margin:14px 0 18px}
.code span{flex:1;max-width:64px;aspect-ratio:3/4;display:grid;place-items:center;background:#1B2033;border-bottom:3px solid var(--acc);border-radius:12px;font-size:clamp(22px,4vw,34px);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff;transition:transform .12s,background .15s}
button:hover{background:#4452FF}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
button.del{color:#C2331F}
:focus-visible{outline:3px solid #9EA8FF;outline-offset:2px}
.lib{background:#fff;border-radius:20px;padding:clamp(18px,3vw,28px)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mut);cursor:pointer;margin:14px 0 8px}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc)}
.drop input{display:none}
ul{list-style:none;padding:0}
li{display:flex;gap:10px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.info{flex:1;min-width:0}
.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{color:var(--mut)}
#none{color:var(--mut);padding:10px 0}
#stage{position:fixed;inset:0;z-index:10;background:#000;display:grid;place-items:center;cursor:none}
#stage.ui{cursor:default}
#stage canvas,#stage img{max-width:100%;max-height:100%}
#cover{position:absolute;inset:0;background:#000}
#bar{position:absolute;top:0;left:0;right:0;display:flex;gap:16px;align-items:center;padding:14px 18px;color:#fff;background:linear-gradient(#000C,transparent);opacity:0;transition:opacity .25s}
#stage.ui #bar{opacity:1}
#bar span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>al present</h1>
  <p>Презентация показывается здесь, а листается с телефона.</p>
</header>
<main>
  <section class="room" aria-label="Комната">
    <div id="empty">
      <h2>Комната</h2>
      <p>Создайте комнату, откройте пульт на втором устройстве и введите код.</p>
      <button id="create">Создать комнату</button>
    </div>
    <div id="live" hidden>
      <h2>Код комнаты</h2>
      <div id="code" class="code" aria-live="polite"></div>
      <p id="stat"></p>
      <div class="row">
        <button id="copy">Скопировать ссылку на пульт</button>
        <button id="close" class="ghost">Закрыть комнату</button>
      </div>
    </div>
  </section>
  <section class="lib" aria-label="Презентации">
    <h2>Презентации</h2>
    <label class="drop" id="drop">
      Выберите PDF или до 12 картинок, либо перетащите сюда
      <input id="file" type="file" multiple accept="application/pdf,image/png,image/jpeg,image/webp,image/gif">
    </label>
    <p id="none">Пока пусто. Загруженные презентации появятся здесь.</p>
    <ul id="list"></ul>
  </section>
</main>

<section id="stage" hidden aria-label="Показ">
  <canvas id="cv" hidden></canvas>
  <img id="im" alt="" hidden>
  <div id="cover" hidden></div>
  <div id="bar"><span id="ttl"></span><span id="cnt"></span><button id="stop">Завершить показ</button></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as pdfjs from '/vendor/pdfjs/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.mjs';

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let KEY = localStorage.getItem('al-key');
if (!/^[a-f0-9]{64}$/.test(KEY || '')) {
  KEY = [...crypto.getRandomValues(new Uint8Array(32))].map((b) => b.toString(16).padStart(2, '0')).join('');
  localStorage.setItem('al-key', KEY);
}
const socket = io();
let room = null, decks = [], drawn = null, task = null, tt, ut;
const loaded = {}, blobs = {};

const emit = (ev, data) => new Promise((res) => socket.timeout(6000).emit(ev, data, (e, r) => res(e ? { error: 'Нет связи с сервером.' } : r || {})));
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3500);
}
async function api(p, o = {}) {
  const r = await fetch('/api' + p, { ...o, headers: { 'X-Device-Key': KEY, ...o.headers } });
  if (!r.ok) { let m = 'Что-то пошло не так.'; try { m = (await r.json()).error; } catch {} throw new Error(m); }
  return r;
}
async function refresh() {
  try { decks = await (await api('/presentations')).json(); list(); } catch (e) { toast(e.message); }
}
function list() {
  $('#none').hidden = decks.length > 0;
  $('#list').innerHTML = decks.map((d) => `<li><div class="info"><b>${esc(d.name)}</b><small>${d.type === 'pdf' ? 'PDF' : d.count + ' изобр.'}, ${(d.size / 1048576).toFixed(1)} МБ</small></div><button data-run="${d.id}" ${room ? '' : 'disabled title="Сначала создайте комнату"'}>Запустить</button><button class="ghost del" data-del="${d.id}">Удалить</button></li>`).join('');
}
function paint() {
  $('#empty').hidden = !!room; $('#live').hidden = !room;
  if (room) {
    $('#code').innerHTML = [...room.code].map((c) => `<span>${c}</span>`).join('');
    $('#stat').textContent = `${room.screenOnline ? 'Экран на связи.' : 'Экран отключён.'} Пультов: ${room.controllers}.`;
  }
  list();
}
function setRoom(r) { room = r; sessionStorage.setItem('al-room', r.code); paint(); sync(); }
function dropRoom() { room = null; sessionStorage.removeItem('al-room'); paint(); sync(); }

async function load(id) {
  if (loaded[id]) return loaded[id];
  let m = decks.find((d) => d.id === id);
  if (!m) { await refresh(); m = decks.find((d) => d.id === id); }
  if (!m) throw new Error('missing');
  const x = { type: m.type };
  if (m.type === 'pdf') x.doc = await pdfjs.getDocument({ url: `/api/presentations/${id}/files/0`, httpHeaders: { 'X-Device-Key': KEY } }).promise;
  return (loaded[id] = x);
}
async function draw(s) {
  const tag = `${s.deckId}:${s.slide}:${innerWidth}x${innerHeight}`;
  if (drawn === tag) return;
  drawn = tag; task?.cancel();
  try {
    const d = await load(s.deckId);
    if (drawn !== tag) return;
    const cv = $('#cv'), im = $('#im');
    if (d.type === 'pdf') {
      const p = await d.doc.getPage(s.slide + 1);
      if (drawn !== tag) return;
      const b = p.getViewport({ scale: 1 }), k = Math.min(innerWidth / b.width, innerHeight / b.height), r = devicePixelRatio || 1, v = p.getViewport({ scale: k * r });
      cv.width = v.width; cv.height = v.height;
      cv.style.width = v.width / r + 'px'; cv.style.height = v.height / r + 'px';
      task = p.render({ canvasContext: cv.getContext('2d'), viewport: v });
      await task.promise;
      cv.hidden = false; im.hidden = true;
    } else {
      const u = `${s.deckId}:${s.slide}`;
      if (!blobs[u]) blobs[u] = URL.createObjectURL(await (await api(`/presentations/${s.deckId}/files/${s.slide}`)).blob());
      if (drawn !== tag) return;
      im.src = blobs[u]; im.hidden = false; cv.hidden = true;
    }
  } catch (e) {
    if (e?.name !== 'RenderingCancelledException' && drawn === tag) toast('Не удалось показать слайд.');
  }
}
function sync() {
  const s = room?.state, st = $('#stage');
  if (!s?.playing) {
    if (!st.hidden) { st.hidden = true; drawn = null; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
    return;
  }
  st.hidden = false;
  $('#ttl').textContent = s.title; $('#cnt').textContent = `${s.slide + 1} / ${s.total}`;
  $('#cover').hidden = !s.blank;
  draw(s);
}

async function resume(n = 0) {
  const code = sessionStorage.getItem('al-room');
  if (!code) return;
  const r = await emit('room:resume', { key: KEY, code, role: 'screen' });
  if (!r.error) return setRoom(r.room);
  if (/другой вкладке|Нет связи/.test(r.error) && n < 20) return setTimeout(() => resume(n + 1), 3000);
  dropRoom();
}
socket.on('connect', () => resume());
socket.on('room:update', setRoom);
socket.on('room:closed', () => { dropRoom(); toast('Комната закрыта.'); });

$('#create').onclick = async () => { const r = await emit('room:create', { key: KEY }); r.error ? toast(r.error) : setRoom(r.room); };
$('#close').onclick = () => emit('room:leave');
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(`${location.origin}/remote.html?c=${room.code}`); toast('Ссылка скопирована.'); }
  catch { toast(`Откройте ${location.origin}/remote.html и введите код ${room.code}.`); }
};
$('#list').onclick = async (e) => {
  const run = e.target.closest('[data-run]')?.dataset.run, del = e.target.closest('[data-del]')?.dataset.del;
  if (run) {
    const d = decks.find((x) => x.id === run);
    document.documentElement.requestFullscreen?.().catch(() => {});
    let total = d.count;
    try { if (d.type === 'pdf') total = (await load(d.id)).doc.numPages; } catch { return toast('Не удалось открыть PDF.'); }
    const r = await emit('presentation:start', { id: d.id, total });
    if (r.error) toast(r.error);
  }
  if (del && confirm('Удалить презентацию?')) {
    try { await api('/presentations/' + del, { method: 'DELETE' }); delete loaded[del]; await refresh(); } catch (er) { toast(er.message); }
  }
};
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach((f) => fd.append('files', f));
  toast('Загружаем…');
  try { await api('/presentations', { method: 'POST', body: fd }); await refresh(); toast('Презентация загружена.'); } catch (e) { toast(e.message); }
  $('#file').value = '';
}
$('#file').onchange = (e) => upload(e.target.files);
const dz = $('#drop');
['dragover', 'dragenter'].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', (e) => upload(e.dataTransfer.files));

$('#stop').onclick = () => emit('presentation:command', { action: 'stop' });
$('#stage').onmousemove = () => { $('#stage').classList.add('ui'); clearTimeout(ut); ut = setTimeout(() => $('#stage').classList.remove('ui'), 2500); };
addEventListener('keydown', (e) => {
  if ($('#stage').hidden) return;
  const a = { ArrowRight: 'next', ' ': 'next', PageDown: 'next', ArrowLeft: 'prev', PageUp: 'prev', b: 'blank', B: 'blank' }[e.key];
  if (a) { e.preventDefault(); emit('presentation:command', { action: a }); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawn = null; sync(); }, 200); });

refresh();
</script>
</body>
</html>
