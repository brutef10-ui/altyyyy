  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;display=swap">
  <link rel="stylesheet" href="css/theatre.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theatre.js"></script>
  <script type="module" src="js/camera.js"></script>
</head>
<body data-page="photo">
  <div class="curtain" aria-hidden="true"><div class="curtain-drape curtain-left"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="curtain-drape curtain-right"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="curtain-valance"></div></div>
  <main class="screen">
    <header class="step-header">
      <a class="back-link" href="index.html" aria-label="Назад к вводу кода">←</a>
      <ol class="steps" aria-label="Шаги входа">
        <li class="is-done">Код</li>
        <li class="is-active" aria-current="step">Фото</li>
        <li>Ник</li>
      </ol>
    </header>

    <section class="panel photo-panel" id="photo-panel" data-mode="empty">
      <p class="panel-stub" aria-hidden="true"><span>Портрет для афиши</span><span>Акт II</span></p>
      <h1>Ваше фото</h1>
      <p class="muted">Фото появится на экране ведущего рядом с вашим ником. После игры оно не сохраняется.</p>

      <div class="camera" id="camera">
        <div class="camera-placeholder" id="placeholder" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 12.2a4.6 4.6 0 1 0 0-9.2 4.6 4.6 0 0 0 0 9.2zm0 2.3c-4.3 0-8.6 2.2-8.6 5.4V21h17.2v-1.1c0-3.2-4.3-5.4-8.6-5.4z"/></svg>
        </div>
        <video id="video" playsinline muted autoplay aria-label="Изображение с камеры" hidden></video>
        <img id="preview" alt="Ваше фото" hidden>
        <div class="camera-busy" id="camera-busy" hidden><span class="spinner spinner-sm" aria-hidden="true"></span></div>
        <div class="camera-flash" id="flash"></div>
      </div>

      <p class="form-error" id="error" role="alert" hidden></p>

      <!-- Камера включена: затвор по центру, слева — галерея, справа — отмена -->
      <div class="camera-live" id="camera-live" hidden>
        <label class="round-action file-button" title="Выбрать из галереи">
          <span class="round-action-icon" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.6"/><path d="M6.5 16.4l4-4.4 3 3 2-2 2.5 3.4"/><circle cx="9" cy="9" r="1.4"/></svg></span>
          <span class="round-action-label">Галерея</span>
          <input type="file" accept="image/*" data-source="gallery" aria-label="Выбрать из галереи">
        </label>
        <button class="btn btn-shutter" id="shoot" type="button" disabled aria-label="Сделать снимок">
          <span class="shutter-ring"></span>
        </button>
        <button class="round-action" id="cancel-camera" type="button">
          <span class="round-action-icon" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 6.6l10.8 10.8M17.4 6.6 6.6 17.4"/></svg></span>
          <span class="round-action-label">Отмена</span>
        </button>
      </div>

      <!-- Два равных способа добавить фото -->
      <div class="photo-choices" id="choices">
        <button class="photo-choice" id="take-selfie" type="button">
          <span class="photo-choice-icon" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.2h3.3l1.8-2.6h6.8l1.8 2.6h3.3v11.2H3.5z"/><circle cx="12" cy="13.4" r="3.6"/></svg></span>
          <span class="photo-choice-label" id="selfie-label">Сделать селфи</span>
        </button>
        <label class="photo-choice file-button" id="gallery-choice">
          <span class="photo-choice-icon" aria-hidden="true"><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.6"/><path d="M6.5 16.4l4-4.4 3 3 2-2 2.5 3.4"/><circle cx="9" cy="9" r="1.4"/></svg></span>
          <span class="photo-choice-label" id="gallery-label">Выбрать из галереи</span>
          <input type="file" id="gallery-input" accept="image/*" data-source="gallery" aria-label="Выбрать из галереи">
        </label>
      </div>
      <!-- Запасной вариант без камеры на странице (http://): системная камера телефона -->
      <input type="file" id="capture-input" accept="image/*" capture="user" data-source="capture" hidden tabindex="-1" aria-hidden="true">

      <button class="btn btn-primary btn-block" id="continue" type="button" disabled>Продолжить</button>
    </section>
  </main>
</body>
</html>
