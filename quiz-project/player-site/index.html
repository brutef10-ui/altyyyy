<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0910">
  <meta name="color-scheme" content="dark">
  <title>AL Studio — вход в игру</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;display=swap">
  <link rel="stylesheet" href="css/theatre.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theatre.js"></script>
  <script type="module" src="js/join.js"></script>
</head>
<body data-page="code">
  <div class="curtain" aria-hidden="true"><div class="curtain-drape curtain-left"></div><div class="curtain-drape curtain-right"></div><div class="curtain-valance"></div></div>
  <main class="screen">
    <div class="logo">
      <svg class="logo-mark brand-mark" viewBox="0 0 64 58" aria-hidden="true"><path d="M5 56V19Q5 5 19 5h26q14 0 14 14v37z" fill="#d8ac4c" stroke="#8f6a22" stroke-width="1.6"/><path d="M11 56V21q0-9 9-9h24q9 0 9 9v35z" fill="#1a0910"/><path d="M11 21q0-9 9-9h24q9 0 9 9v2q-4 5-8.4 0-4.2 5-8.4 0-4.2 5-8.4 0-4.2 5-8.4 0Q15 28 11 23z" fill="#8c1529"/><path d="M11 23.2q4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0" fill="none" stroke="#f3d98b" stroke-width="1.2"/><path d="M11 24c9 3 9 18 4.6 32H11z" fill="#b3243d"/><path d="M53 24c-9 3-9 18-4.6 32H53z" fill="#b3243d"/><path d="M13.4 27c3 5 2.6 14 .6 26M50.6 27c-3 5-2.6 14-.6 26" fill="none" stroke="#5c0c1b" stroke-width="1.1" stroke-linecap="round"/><circle cx="16.8" cy="40" r="1.9" fill="#f3d98b" stroke="#8f6a22" stroke-width=".8"/><circle cx="47.2" cy="40" r="1.9" fill="#f3d98b" stroke="#8f6a22" stroke-width=".8"/><rect x="11" y="51.5" width="42" height="4.5" fill="#6b3f22"/><text x="32" y="47" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="15.5" fill="#f3d98b">AL</text></svg>
      <span class="brand-word"><span class="brand-al">AL</span><span class="brand-studio">Studio</span></span>
    </div>

    <ol class="steps" aria-label="Шаги входа">
      <li class="is-active" aria-current="step">Код</li>
      <li>Фото</li>
      <li>Ник</li>
    </ol>

    <form class="panel" id="code-form" novalidate>
      <p class="panel-stub" aria-hidden="true"><span>Входной билет</span><span>Акт I</span></p>
      <h1>Вход в игру</h1>
      <p class="muted">Введите код комнаты с экрана ведущего</p>
      <input id="code" class="input code-input" type="text" inputmode="numeric" autocomplete="off" maxlength="7"
             placeholder="000 000" aria-label="Код комнаты, 6 цифр" enterkeyhint="go">
      <p class="form-error" id="error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="submit" disabled>Войти</button>
    </form>
  </main>
</body>
</html>
