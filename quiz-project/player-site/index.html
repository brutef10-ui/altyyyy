<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d2b">
  <meta name="color-scheme" content="dark">
  <title>AL Studio — вход в игру</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff6a3d' d='M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/join.js"></script>
</head>
<body data-page="code">
  <main class="screen">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z"/></svg>
      AL Studio
    </div>

    <ol class="steps" aria-label="Шаги входа">
      <li class="is-active" aria-current="step">Код</li>
      <li>Селфи</li>
      <li>Ник</li>
    </ol>

    <form class="panel" id="code-form" novalidate>
      <h1>Вход в игру</h1>
      <p class="muted">Введите код комнаты с экрана ведущего</p>
      <input id="code" class="input code-input" type="text" inputmode="numeric" autocomplete="off" maxlength="7"
             placeholder="000 000" aria-label="Код комнаты, 6 цифр" enterkeyhint="go">
      <p class="form-error" id="error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="submit" disabled>Войти</button>
    </form>
  </main>
</body>
</html>
