<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21242e">
  <meta name="color-scheme" content="light">
  <title>AL Studio — вход в игру</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 46'%3E%3Cpath d='M9 3h31l13 13v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z' fill='#21242e' stroke='#8ba1d4' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M13 8.5h22M13 11.8h22' stroke='#60619c' stroke-width='1.6' stroke-linecap='round'/%3E%3Crect x='10' y='15.5' width='34' height='21' rx='2.5' fill='#e60012'/%3E%3Crect x='10' y='15.5' width='34' height='5' rx='2.5' fill='#ff5a5a' opacity='.55'/%3E%3Ctext x='26.5' y='32.4' text-anchor='middle' font-family='Russo One, Arial Black, Arial, sans-serif' font-weight='900' font-size='15' fill='#fff' stroke='#21242e' stroke-width='2.4' paint-order='stroke' letter-spacing='.5'%3EAL%3C/text%3E%3Ccircle cx='45' cy='36' r='7.2' fill='#f68d1f' stroke='#21242e' stroke-width='2.2'/%3E%3Cpath d='M43 32.6v6.8l5.6-3.4z' fill='#fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700;800;900&family=Russo+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/console.css">
  <script type="module" src="js/join.js"></script>
</head>
<body data-page="code">
  <main class="screen">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 56 46" aria-hidden="true"><path d="M9 3h31l13 13v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z" fill="#21242e" stroke="#8ba1d4" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 8.5h22M13 11.8h22" stroke="#60619c" stroke-width="1.6" stroke-linecap="round"/><rect x="10" y="15.5" width="34" height="21" rx="2.5" fill="#e60012"/><rect x="10" y="15.5" width="34" height="5" rx="2.5" fill="#ff5a5a" opacity=".55"/><text x="26.5" y="32.4" text-anchor="middle" font-family="Russo One, Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#fff" stroke="#21242e" stroke-width="2.4" paint-order="stroke" letter-spacing=".5">AL</text><circle cx="45" cy="36" r="7.2" fill="#f68d1f" stroke="#21242e" stroke-width="2.2"/><path d="M43 32.6v6.8l5.6-3.4z" fill="#fff"/></svg>
      <span class="brand-word"><span class="brand-al">AL</span><span class="brand-studio">Studio</span></span>
    </div>

    <ol class="steps" aria-label="Шаги входа">
      <li class="is-active" aria-current="step">Код</li>
      <li>Фото</li>
      <li>Ник</li>
    </ol>

    <form class="panel" id="code-form" novalidate>
      <h1>Вход в игру</h1>
      <p class="muted">Введите код комнаты с экрана ведущего</p>
      <input id="code" class="input code-input" type="text" inputmode="numeric" autocomplete="off" maxlength="7"
             placeholder="000 000" aria-label="Код комнаты, 6 цифр" enterkeyhint="go">
      <p class="form-error" id="error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="submit" disabled>Войти</button>
    </form>
  </main>
</body>
</html>
