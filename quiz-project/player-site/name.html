<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21242e">
  <meta name="color-scheme" content="light">
  <title>AL Studio — ваш ник</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 46'%3E%3Cpath d='M9 3h31l13 13v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z' fill='#21242e' stroke='#8ba1d4' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M13 8.5h22M13 11.8h22' stroke='#60619c' stroke-width='1.6' stroke-linecap='round'/%3E%3Crect x='10' y='15.5' width='34' height='21' rx='2.5' fill='#e60012'/%3E%3Crect x='10' y='15.5' width='34' height='5' rx='2.5' fill='#ff5a5a' opacity='.55'/%3E%3Ctext x='26.5' y='32.4' text-anchor='middle' font-family='Russo One, Arial Black, Arial, sans-serif' font-weight='900' font-size='15' fill='#fff' stroke='#21242e' stroke-width='2.4' paint-order='stroke' letter-spacing='.5'%3EAL%3C/text%3E%3Ccircle cx='45' cy='36' r='7.2' fill='#f68d1f' stroke='#21242e' stroke-width='2.2'/%3E%3Cpath d='M43 32.6v6.8l5.6-3.4z' fill='#fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700;800;900&family=Russo+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/console.css">
  <script type="module" src="js/join.js"></script>
</head>
<body data-page="name">
  <main class="screen">
    <header class="step-header">
      <a class="back-link" href="photo.html" aria-label="Назад к фото">←</a>
      <ol class="steps" aria-label="Шаги входа">
        <li class="is-done">Код</li>
        <li class="is-done">Фото</li>
        <li class="is-active" aria-current="step">Ник</li>
      </ol>
    </header>

    <form class="panel" id="name-form" novalidate>
      <a class="avatar-edit" href="photo.html" title="Сменить фото" aria-label="Сменить фото">
        <img class="avatar avatar-xl" id="avatar" alt="Ваше фото">
        <span class="avatar-edit-badge" aria-hidden="true">↻</span>
      </a>
      <h1>Как вас назвать?</h1>
      <p class="muted" id="room-title"></p>
      <input id="nickname" class="input nickname-input" type="text" maxlength="16" autocomplete="nickname"
             autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Ваш ник" aria-describedby="nick-hint">
      <div class="hint-row">
        <span id="nick-hint" class="muted">2–16 символов: буквы, цифры, пробел, «_», «-», «.»</span>
        <span id="counter" class="muted">0/16</span>
      </div>
      <p class="form-error" id="error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="submit" disabled>Готово — в игру!</button>
    </form>
  </main>
</body>
</html>
