<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d2b">
  <meta name="color-scheme" content="dark">
  <title>AL Studio — ваш ник</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff6a3d' d='M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/join.js"></script>
</head>
<body data-page="name">
  <main class="screen">
    <header class="step-header">
      <a class="back-link" href="photo.html" aria-label="Назад к фото">←</a>
      <ol class="steps" aria-label="Шаги входа">
        <li class="is-done">Код</li>
        <li class="is-done">Фото</li>
        <li class="is-active" aria-current="step">Ник</li>
      </ol>
    </header>

    <form class="panel" id="name-form" novalidate>
      <a class="avatar-edit" href="photo.html" title="Сменить фото" aria-label="Сменить фото">
        <img class="avatar avatar-xl" id="avatar" alt="Ваше фото">
        <span class="avatar-edit-badge" aria-hidden="true">↻</span>
      </a>
      <h1>Как вас назвать?</h1>
      <p class="muted" id="room-title"></p>
      <input id="nickname" class="input nickname-input" type="text" maxlength="16" autocomplete="nickname"
             autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Ваш ник" aria-describedby="nick-hint">
      <div class="hint-row">
        <span id="nick-hint" class="muted">2–16 символов: буквы, цифры, пробел, «_», «-», «.»</span>
        <span id="counter" class="muted">0/16</span>
      </div>
      <p class="form-error" id="error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="submit" disabled>Готово — в игру!</button>
    </form>
  </main>
</body>
</html>
