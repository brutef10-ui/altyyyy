  <header class="topbar">

      <span class="brand-word">Luminous</span>
    </span>
    <div class="topbar-title" id="quiz-title"></div>
    <button class="btn btn-ghost" id="cancel" type="button">Отменить игру</button>
  </header>

  <main class="lobby">
    <section class="join-panel card">
      <div class="join-text">
        <p class="kicker join-kicker">Скоро начало</p>
        <p class="join-step"><span class="step-num">1</span> Откройте на телефоне <strong id="join-url">…</strong></p>
        <p class="join-step"><span class="step-num">2</span> Введите код комнаты:</p>
        <button class="room-code" id="room-code" type="button" title="Нажмите, чтобы скопировать">••• •••</button>
      </div>
      <div class="qr" id="qr" hidden></div>
    </section>

    <section class="players-panel">
      <div class="players-head">
        <h2>Игроки <span class="count-badge" id="player-count">0</span></h2>
        <p class="muted" id="lobby-hint">Ждём игроков…</p>
      </div>
      <ul class="player-grid" id="players" aria-live="polite"></ul>
    </section>
  </main>

  <footer class="action-bar stage-bar">
    <div class="action-bar-inner">
      <span class="muted">Нажмите на игрока, чтобы удалить его из комнаты</span>
      <button class="btn btn-primary btn-xl" id="start" type="button" disabled>Старт ▶</button>
    </div>
  </footer>
</body>
