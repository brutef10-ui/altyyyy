<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1a0910">
  <title>AL Studio — лобби</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 58'%3E%3Cpath d='M5 56V19Q5 5 19 5h26q14 0 14 14v37z' fill='%23d8ac4c' stroke='%238f6a22' stroke-width='1.6'/%3E%3Cpath d='M11 56V21q0-9 9-9h24q9 0 9 9v35z' fill='%231a0910'/%3E%3Cpath d='M11 21q0-9 9-9h24q9 0 9 9v2q-4 5-8.4 0-4.2 5-8.4 0-4.2 5-8.4 0-4.2 5-8.4 0Q15 28 11 23z' fill='%238c1529'/%3E%3Cpath d='M11 23.2q4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0' fill='none' stroke='%23f3d98b' stroke-width='1.2'/%3E%3Cpath d='M11 24c9 3 9 18 4.6 32H11z' fill='%23b3243d'/%3E%3Cpath d='M53 24c-9 3-9 18-4.6 32H53z' fill='%23b3243d'/%3E%3Cpath d='M13.4 27c3 5 2.6 14 .6 26M50.6 27c-3 5-2.6 14-.6 26' fill='none' stroke='%235c0c1b' stroke-width='1.1' stroke-linecap='round'/%3E%3Ccircle cx='16.8' cy='40' r='1.9' fill='%23f3d98b' stroke='%238f6a22' stroke-width='.8'/%3E%3Ccircle cx='47.2' cy='40' r='1.9' fill='%23f3d98b' stroke='%238f6a22' stroke-width='.8'/%3E%3Crect x='11' y='51.5' width='42' height='4.5' fill='%236b3f22'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia, serif' font-weight='900' font-size='15.5' fill='%23f3d98b'%3EAL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;display=swap">
  <link rel="stylesheet" href="css/theatre.css">
  <link rel="stylesheet" href="css/lobby.css">
  <script type="module" src="js/theatre.js"></script>
  <script type="module" src="js/lobby.js"></script>
</head>
<body class="page-lobby stage">
  <div class="curtain" aria-hidden="true"><div class="curtain-drape curtain-left"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="curtain-drape curtain-right"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="curtain-valance"></div></div>
  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 64 58" aria-hidden="true"><path d="M5 56V19Q5 5 19 5h26q14 0 14 14v37z" fill="#d8ac4c" stroke="#8f6a22" stroke-width="1.6"/><path d="M11 56V21q0-9 9-9h24q9 0 9 9v35z" fill="#1a0910"/><path d="M11 21q0-9 9-9h24q9 0 9 9v2q-4 5-8.4 0-4.2 5-8.4 0-4.2 5-8.4 0-4.2 5-8.4 0Q15 28 11 23z" fill="#8c1529"/><path d="M11 23.2q4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0 4.2 4.8 8.4 0" fill="none" stroke="#f3d98b" stroke-width="1.2"/><path d="M11 24c9 3 9 18 4.6 32H11z" fill="#b3243d"/><path d="M53 24c-9 3-9 18-4.6 32H53z" fill="#b3243d"/><path d="M13.4 27c3 5 2.6 14 .6 26M50.6 27c-3 5-2.6 14-.6 26" fill="none" stroke="#5c0c1b" stroke-width="1.1" stroke-linecap="round"/><circle cx="16.8" cy="40" r="1.9" fill="#f3d98b" stroke="#8f6a22" stroke-width=".8"/><circle cx="47.2" cy="40" r="1.9" fill="#f3d98b" stroke="#8f6a22" stroke-width=".8"/><rect x="11" y="51.5" width="42" height="4.5" fill="#6b3f22"/><text x="32" y="47" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="15.5" fill="#f3d98b">AL</text></svg>
      <span class="brand-word"><span class="brand-al">AL</span><span class="brand-studio">Studio</span></span>
    </span>
    <div class="topbar-title" id="quiz-title"></div>
    <button class="btn btn-ghost" id="cancel" type="button">Отменить игру</button>
  </header>

  <main class="lobby">
    <section class="join-panel card">
      <div class="join-text">
        <p class="kicker join-kicker">Скоро начало</p>
        <p class="join-step"><span class="step-num">1</span> Откройте на телефоне <strong id="join-url">…</strong></p>
        <p class="join-step"><span class="step-num">2</span> Введите код комнаты:</p>
        <button class="room-code" id="room-code" type="button" title="Нажмите, чтобы скопировать">••• •••</button>
      </div>
      <div class="qr" id="qr" hidden></div>
    </section>

    <section class="players-panel">
      <div class="players-head">
        <h2>Игроки <span class="count-badge" id="player-count">0</span></h2>
        <p class="muted" id="lobby-hint">Ждём игроков…</p>
      </div>
      <ul class="player-grid" id="players" aria-live="polite"></ul>
    </section>
  </main>

  <footer class="action-bar stage-bar">
    <div class="action-bar-inner">
      <span class="muted">Нажмите на игрока, чтобы удалить его из комнаты</span>
      <button class="btn btn-primary btn-xl" id="start" type="button" disabled>Старт ▶</button>
    </div>
  </footer>
</body>
</html>
