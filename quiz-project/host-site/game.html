<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AL Studio — игра</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff6a3d' d='M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/game.js"></script>
</head>
<body class="page-game stage">
  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z"/></svg>
      AL Studio
    </span>
    <div class="game-meta">
      <span class="pill" id="q-counter">Вопрос –</span>
      <span class="pill">Код <b id="room-code">––––––</b></span>
    </div>
    <div class="answers-counter" aria-live="polite">
      <span id="answered">0</span>
      <small id="answered-label">ответов</small>
    </div>
  </header>

  <main class="game" id="game" hidden>
    <section class="question-banner" id="question-banner">
      <h1 id="question-text"></h1>
    </section>

    <section class="game-middle">
      <div class="timer" id="timer" role="timer" aria-live="off">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="timer-track" cx="60" cy="60" r="54"></circle>
          <circle class="timer-progress" id="timer-progress" cx="60" cy="60" r="54"></circle>
        </svg>
        <span class="timer-value" id="timer-value">0</span>
      </div>

      <div class="results-panel" id="results-panel" hidden>
        <div class="bars" id="bars"></div>
        <div class="leaderboard card">
          <h3>Лидеры</h3>
          <ol class="leader-list" id="leaderboard"></ol>
        </div>
      </div>
    </section>

    <section class="answer-grid" id="answers"></section>
  </main>

  <footer class="action-bar stage-bar">
    <div class="action-bar-inner">
      <span class="muted" id="phase-hint">Пробел или → — следующий шаг</span>
      <button class="btn btn-primary btn-lg" id="next" type="button" disabled>Завершить вопрос</button>
    </div>
  </footer>
</body>
</html>
