<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AL Studio — итоги</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff6a3d' d='M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/results.js"></script>
</head>
<body class="page-results stage">
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z"/></svg>
      AL Studio
    </span>
    <div class="topbar-title" id="quiz-title"></div>
    <span class="pill" id="player-total"></span>
  </header>

  <main class="results" id="results" hidden>
    <h1 class="results-title">Итоги игры</h1>
    <section class="podium" id="podium" aria-label="Пьедестал"></section>
    <section class="card ranking">
      <h2>Все игроки</h2>
      <ol class="ranking-list" id="ranking"></ol>
    </section>
  </main>

  <footer class="action-bar stage-bar">
    <div class="action-bar-inner">
      <button class="btn btn-ghost" id="home" type="button">← На главную</button>
      <div class="action-bar-buttons">
        <button class="btn btn-ghost" id="replay" type="button">↻ Сыграть ещё раз</button>
        <button class="btn btn-primary btn-lg" id="save" type="button" hidden>Сохранить игру</button>
      </div>
    </div>
  </footer>
</body>
</html>
