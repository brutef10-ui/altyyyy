<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AL Studio — награждение</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 46'%3E%3Cpath d='M9 3h31l13 13v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z' fill='#21242e' stroke='#8ba1d4' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M13 8.5h22M13 11.8h22' stroke='#60619c' stroke-width='1.6' stroke-linecap='round'/%3E%3Crect x='10' y='15.5' width='34' height='21' rx='2.5' fill='#e60012'/%3E%3Crect x='10' y='15.5' width='34' height='5' rx='2.5' fill='#ff5a5a' opacity='.55'/%3E%3Ctext x='26.5' y='32.4' text-anchor='middle' font-family='Russo One, Arial Black, Arial, sans-serif' font-weight='900' font-size='15' fill='#fff' stroke='#21242e' stroke-width='2.4' paint-order='stroke' letter-spacing='.5'%3EAL%3C/text%3E%3Ccircle cx='45' cy='36' r='7.2' fill='#f68d1f' stroke='#21242e' stroke-width='2.2'/%3E%3Cpath d='M43 32.6v6.8l5.6-3.4z' fill='#fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700;800;900&family=Russo+One&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/console.css">
  <script type="module" src="js/results.js"></script>
</head>
<body class="page-results stage">
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <header class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 56 46" aria-hidden="true"><path d="M9 3h31l13 13v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z" fill="#21242e" stroke="#8ba1d4" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 8.5h22M13 11.8h22" stroke="#60619c" stroke-width="1.6" stroke-linecap="round"/><rect x="10" y="15.5" width="34" height="21" rx="2.5" fill="#e60012"/><rect x="10" y="15.5" width="34" height="5" rx="2.5" fill="#ff5a5a" opacity=".55"/><text x="26.5" y="32.4" text-anchor="middle" font-family="Russo One, Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#fff" stroke="#21242e" stroke-width="2.4" paint-order="stroke" letter-spacing=".5">AL</text><circle cx="45" cy="36" r="7.2" fill="#f68d1f" stroke="#21242e" stroke-width="2.2"/><path d="M43 32.6v6.8l5.6-3.4z" fill="#fff"/></svg>
      <span class="brand-word"><span class="brand-al">AL</span><span class="brand-studio">Studio</span></span>
    </span>
    <div class="topbar-title" id="quiz-title"></div>
    <div class="topbar-tools">
      <span class="pill" id="player-total"></span>
      <button class="icon-btn sound-toggle" id="sound" type="button" aria-pressed="true" title="Выключить звук">🔊</button>
    </div>
  </header>

  <main class="ceremony" id="ceremony" data-stage="intro" hidden>
    <section class="ceremony-intro" id="intro" aria-labelledby="intro-kicker">
      <div class="intro-rays" aria-hidden="true"></div>
      <div class="intro-trophy" aria-hidden="true">🏆</div>
      <p class="intro-kicker" id="intro-kicker">Церемония награждения</p>
      <h1 class="intro-title" id="intro-title"></h1>
      <p class="intro-meta" id="intro-meta"></p>
      <button class="btn btn-primary btn-xl intro-start" id="start" type="button">Начать награждение</button>
      <p class="intro-hint muted">🔊 Включите звук — будет барабанная дробь</p>
    </section>

    <section class="ceremony-stage" id="stage" aria-label="Пьедестал">
      <h1 class="ceremony-caption" id="caption" aria-live="polite"></h1>
      <div class="podium" id="podium"></div>
    </section>

    <section class="card ranking" id="ranking-card">
      <h2>Все игроки</h2>
      <ol class="ranking-list" id="ranking"></ol>
    </section>
  </main>

  <footer class="action-bar stage-bar">
    <div class="action-bar-inner">
      <div class="ceremony-controls" id="ceremony-controls">
        <span class="muted" id="ceremony-hint">Места объявляются по очереди: 3 → 2 → 1</span>
        <button class="btn btn-ghost btn-small skip-button" id="skip" type="button">Показать сразу ⏭</button>
      </div>
      <div class="final-actions" id="final-actions" hidden>
        <button class="btn btn-ghost" id="home" type="button">← На главную</button>
        <div class="action-bar-buttons">
          <button class="btn btn-ghost" id="replay" type="button">↻ Сыграть ещё раз</button>
          <button class="btn btn-primary btn-lg" id="save" type="button" hidden>Сохранить игру</button>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
