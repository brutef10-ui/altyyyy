<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Искра — мои игры</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff6a3d' d='M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/home.js"></script>
</head>
<body class="page-home">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Искра — на главную">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1l3.6 11.4L31 16l-11.4 3.6L16 31l-3.6-11.4L1 16l11.4-3.6z"/></svg>
      Искра
    </a>
    <a class="btn btn-primary" href="editor.html">+ Создать новую</a>
  </header>

  <main class="container">
    <section class="page-intro">
      <h1>Мои игры</h1>
      <p class="muted">Игры сохраняются на сервере и привязаны к этому браузеру. Запустите любую — для каждого запуска создаётся новая комната с новым кодом.</p>
    </section>

    <div id="active-game" class="banner" hidden>
      <span>У вас есть незавершённая игра (код <b id="active-code"></b>).</span>
      <span class="banner-actions">
        <a class="btn btn-small btn-primary" href="lobby.html">Вернуться</a>
        <button class="btn btn-small btn-ghost" id="forget-game" type="button">Забыть</button>
      </span>
    </div>

    <div id="status" class="status" hidden></div>
    <div id="quiz-list" class="quiz-grid" aria-live="polite" aria-busy="true">
      <div class="quiz-card skeleton"></div>
      <div class="quiz-card skeleton"></div>
      <div class="quiz-card skeleton"></div>
    </div>
  </main>
</body>
</html>
