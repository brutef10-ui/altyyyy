  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page-home">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="AL Studio — на главную">
      <svg class="brand-mark" viewBox="0 0 56 46" aria-hidden="true"><path d="M9 3h31l13 13v24a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z" fill="#21242e" stroke="#8ba1d4" stroke-width="2.5" stroke-linejoin="round"/><path d="M13 8.5h22M13 11.8h22" stroke="#60619c" stroke-width="1.6" stroke-linecap="round"/><rect x="10" y="15.5" width="34" height="21" rx="2.5" fill="#e60012"/><rect x="10" y="15.5" width="34" height="5" rx="2.5" fill="#ff5a5a" opacity=".55"/><text x="26.5" y="32.4" text-anchor="middle" font-family="Russo One, Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#fff" stroke="#21242e" stroke-width="2.4" paint-order="stroke" letter-spacing=".5">AL</text><circle cx="45" cy="36" r="7.2" fill="#f68d1f" stroke="#21242e" stroke-width="2.2"/><path d="M43 32.6v6.8l5.6-3.4z" fill="#fff"/></svg>
      <span class="brand-word"><span class="brand-al">AL</span><span class="brand-studio">Studio</span></span>
    </a>
    <a class="btn btn-primary" href="editor.html">+ Создать новую</a>
  </header>

  <main class="container">
    <section class="page-intro">
      <h1>Мои игры</h1>
      <p class="muted">Игры сохраняются на сервере и привязаны к этому браузеру. Запустите любую — для каждого запуска создаётся новая комната с новым кодом.</p>
    </section>

    <div id="active-game" class="banner" hidden>
      <span>У вас есть незавершённая игра (код <b id="active-code"></b>).</span>
      <span class="banner-actions">
        <a class="btn btn-small btn-primary" href="lobby.html">Вернуться</a>
        <button class="btn btn-small btn-ghost" id="forget-game" type="button">Забыть</button>
      </span>
    </div>

    <div id="status" class="status" hidden></div>
    <div id="quiz-list" class="quiz-grid" aria-live="polite" aria-busy="true">
      <div class="quiz-card skeleton"></div>
      <div class="quiz-card skeleton"></div>
      <div class="quiz-card skeleton"></div>
    </div>
  </main>
</body>
</html>
